# Deploy config (remote deployment service)
deploy:
  remote:
    bind: 0.0.0.0
    # bind controls exposure:
    # - localhost/LAN: use direct local or private-network access
    # - WAN: bind to public IP and put HTTPS in front (reverse proxy)
    port: 9090
    root: deploy
    port_start: 8080
    logs_enabled: true
    credentials:
      user:
        env: HB_DEPLOY_REMOTE_USER
      password:
        env: HB_DEPLOY_REMOTE_PASSWORD
    hmac_secret:
      env: HB_DEPLOY_REMOTE_HMAC_SECRET
    auth:
      env_prefix: HB_DEPLOY_SECRET_
    # binary: /usr/local/bin/hyperbricks
