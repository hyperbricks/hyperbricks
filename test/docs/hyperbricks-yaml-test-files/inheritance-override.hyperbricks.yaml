base_card:
  - type: template
  - template: "{{TEMPLATE:cards/card.html}}"
  - values:
      title: Base title
      body: Base body
      width: 320
      theme:
        tone: neutral
        density: compact

page:
  - type: hypermedia
  - route: inheritance-override

  - featured_card:
      - inherit: base_card
      - values:
          title: Overridden title
          theme:
            tone: strong
