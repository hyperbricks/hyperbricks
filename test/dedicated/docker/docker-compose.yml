services:
  postgres:
    build:
      context: ./postgres
    container_name: postgres_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: "${POSTGRES_DB:-postgres}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?Run ./setup-env.sh or set POSTGRES_PASSWORD}"
      POSTGRES_USER: "${POSTGRES_USER:-postgres}"
      PGRST_JWT_SECRET: "${PGRST_JWT_SECRET:?Run ./setup-env.sh or set PGRST_JWT_SECRET}"
    volumes:
      - postgres:/var/lib/postgresql/data
      - ./init.sh:/docker-entrypoint-initdb.d/10-init.sh:ro
      - ./init.sql:/docker-init/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 10
  server:
    image: postgrest/postgrest:v14.17
    container_name: postgrest_service
    ports:
      - "127.0.0.1:${POSTGREST_PORT:-3000}:3000"
    environment:
      PGRST_DB_URI: "postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:?Run ./setup-env.sh or set POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-postgres}"
      PGRST_DB_ANON_ROLE: web_anon
      PGRST_DB_SCHEMA: "public"
      PGRST_LOG_LEVEL: warn
      PGRST_SERVER_PORT: 3000
      PGRST_JWT_SECRET: "${PGRST_JWT_SECRET:?Run ./setup-env.sh or set PGRST_JWT_SECRET}"
    depends_on:
      postgres:
        condition: service_healthy

  pgadmin:
    image: dpage/pgadmin4:9.17
    environment:
      PGADMIN_DEFAULT_EMAIL: "${PGADMIN_DEFAULT_EMAIL:-admin@example.invalid}"
      PGADMIN_DEFAULT_PASSWORD: "${PGADMIN_DEFAULT_PASSWORD:?Run ./setup-env.sh or set PGADMIN_DEFAULT_PASSWORD}"
      PGADMIN_LISTEN_PORT: 80
      PGADMIN_SERVER_JSON_FILE: /pgadmin4/servers.json
    ports:
      - "127.0.0.1:${PGADMIN_PORT:-15432}:80"
    volumes:
      - pgadmin:/var/lib/pgadmin
      - ./servers.json:/pgadmin4/servers.json:ro
    depends_on:
      postgres:
        condition: service_healthy
volumes:
  postgres:
  pgadmin:
