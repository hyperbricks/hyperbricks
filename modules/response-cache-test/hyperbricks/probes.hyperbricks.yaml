healthz:
  - type: fragment
  - route: healthz
  - nocache: true
  - content_type: text/plain; charset=utf-8
  - template:
      inline: ok

index:
  - inherit: healthz
  - route: index

# This route is also the common source of every ordinary probe's workload.
# A timestamp generated by the built-in template engine makes reuse observable
# without a plugin, Goja, an external service, or a change to rendering policy.
probe_default:
  - type: fragment
  - route: probe/default
  - content_type: text/plain; charset=utf-8
  - response:
      headers:
        X-Cache-Fixture: response-cache-test
        Cache-Control: no-store
  - template:
      querykeys: [variant]
      inline: 'rendered_at={{ (now).UnixNano }} variant={{ default "default" .Params.variant }}'

probe_scalar:
  - inherit: probe_default
  - route: probe/scalar
  - cache: 1s

probe_mem:
  - inherit: probe_default
  - route: probe/mem
  - cache: {storage: mem, expire: 1s}

probe_expire_only:
  - inherit: probe_default
  - route: probe/expire-only
  - cache: {expire: 1s}

probe_empty:
  - inherit: probe_default
  - route: probe/empty
  - cache: {}

probe_disk:
  - inherit: probe_default
  - route: probe/disk
  - cache: {storage: disk, expire: 1s}

probe_disk_inherit:
  - inherit: probe_default
  - route: probe/disk-inherit
  - cache: {storage: disk}

probe_zero_mem:
  - inherit: probe_default
  - route: probe/zero-mem
  - cache: {storage: mem, expire: 0s}

probe_zero_scalar:
  - inherit: probe_default
  - route: probe/zero-scalar
  - cache: 0s

probe_zero_disk:
  - inherit: probe_default
  - route: probe/zero-disk
  - cache: {storage: disk, expire: 0s}

probe_nocache:
  - inherit: probe_default
  - route: probe/nocache
  - nocache: true
  - cache: {storage: disk, expire: 10m}

probe_page_mem:
  - inherit: probe_default
  - type: hypermedia
  - route: probe/page-mem
  - cache: {storage: mem, expire: 1s}

probe_page_disk:
  - inherit: probe_default
  - type: hypermedia
  - route: probe/page-disk
  - cache: {storage: disk, expire: 1s}
