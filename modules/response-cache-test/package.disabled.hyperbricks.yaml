hyperbricks:
  mode: live
  metadata:
    module: response-cache-test
    moduleversion: "1.0.0"
    hyperbricks: v1.3.0-beta
  logger:
    level: info
    format: console
  development:
    watch: false
    reload: false
    frontend_errors: false
    frontend_editing:
      enabled: false
      spaces:
        enabled: false
    dashboard:
      enabled: false
  live:
    cache: 0s
    disk_cache:
      max_bytes: 268435456
      max_entries: 10000
      cleanup_interval: 200ms
  server:
    port: 8179
    gomaxprocs: 4
    beautify: false
    read_timeout: 30s
    write_timeout: 30s
    idle_timeout: 30s
    keep_alives_enabled: true
  system:
    metrics_watch_interval: 1h
  rate_limit:
    enabled: false
  plugins:
    enabled: []
  directories:
    hyperbricks:
      path: {base: module, path: hyperbricks}
    templates:
      path: {base: module, path: templates}
    resources:
      path: {base: module, path: resources}
    static:
      path: {base: module, path: static}
    render:
      path: {base: module, path: rendered}
    plugins:
      path: {base: module, path: plugins}
