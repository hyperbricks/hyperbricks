hyperbricks:
  metadata:
    module: catalog-store
    moduleversion: "1.0.0"
    hyperbricks: v1.2.9-beta
  mode: development
  rate_limit:
    enabled: false
  development:
    watch: false
    reload: false
    dashboard:
      enabled: false
      credentials:
        user: {env: HB_DEVELOPER_USER}
        password: {env: HB_DEVELOPER_PASSWORD}
    frontend_editing:
      enabled: false
    services:
      - name: catalog-api
        command: [sh, server.sh]
        cwd: {path: {base: module, path: demo-api}}
        env:
          PYTHONUNBUFFERED: "1"
          CATALOG_API_PORT: {env: {name: CATALOG_API_PORT, default: "4319"}}
        ready:
          http:
            format: "http://127.0.0.1:%s/health"
            args:
              - env: {name: CATALOG_API_PORT, default: "4319"}
          timeout: 10s
        stop_timeout: 5s
  server:
    port: {env: {name: PORT, default: 4320}}
  directories:
    plugins:
      path: {base: module, path: plugins}
    render:
      path: {base: module, path: rendered}
    static:
      path: {base: module, path: static}
    resources:
      path: {base: module, path: resources}
    templates:
      path: {base: module, path: templates}
    hyperbricks:
      path: {base: module, path: hyperbricks}
  logger:
    level: info
