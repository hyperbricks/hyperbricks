imports:
  - partials/yaml-spectrum.shared.hyperbricks.yaml

yaml_spectrum:
  - type: hypermedia
  - route: yaml-spectrum
  - title: "{{CONF:myconf.demo.title}}"
  - bodytag: <body class="yaml-spectrum">|</body>
  - guard:
      enabled: false
      auth:
        cookie: hb_session
      require:
        authenticated: false
  - head:
      - type: head
      - meta:
          description: HyperBricks YAML runtime pipeline demo
      - style:
          - type: css
          - inline: |
              .yaml-spectrum {
                margin: 0;
                font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
                background: #f7f7f4;
                color: #1d2522;
              }
              .spectrum-page {
                max-width: 1120px;
                margin: 0 auto;
                padding: 48px 24px;
              }
              .spectrum-hero,
              .spectrum-card,
              .spectrum-paths,
              .spectrum-status {
                background: #ffffff;
                border: 1px solid #d9ded7;
                border-radius: 8px;
                padding: 24px;
                margin-bottom: 18px;
              }
              .spectrum-grid {
                display: grid;
                grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
                gap: 18px;
              }
              .spectrum-eyebrow {
                margin: 0 0 8px;
                color: #44645c;
                font-size: 0.78rem;
                font-weight: 700;
                letter-spacing: 0.08em;
                text-transform: uppercase;
              }
              .spectrum-card h2,
              .spectrum-hero h1 {
                margin: 0 0 10px;
              }
              .spectrum-card ul {
                display: flex;
                flex-wrap: wrap;
                gap: 8px;
                padding: 0;
                margin: 16px 0 0;
                list-style: none;
              }
              .spectrum-card li {
                border: 1px solid #c8d7d0;
                border-radius: 999px;
                padding: 4px 10px;
                background: #eef5f1;
                font-size: 0.85rem;
              }
              .spectrum-paths code {
                overflow-wrap: anywhere;
              }
              .spectrum-action {
                display: inline-flex;
                align-items: center;
                margin-top: 12px;
                color: #0b5d4c;
                font-weight: 700;
              }
  - main:
      - type: tree
      - hero:
          - type: template
          - inline: |
              <main class="spectrum-page">
                <section class="spectrum-hero">
                  <p class="spectrum-eyebrow">runtime YAML source</p>
                  <h1>{{.heading}}</h1>
                  {{.lead}}
                  <p><strong>Config:</strong> {{.summary}}</p>
                  <p><strong>ENV:SHELL:</strong> <code>{{.shell}}</code></p>
                </section>
              </main>
          - values:
              heading: "{{CONF:myconf.demo.heading}}"
              summary: "{{CONF:myconf.demo.summary}}"
              shell: "{{ENV:SHELL}}"
              lead:
                - type: html
                - value: |
                    {{FILE:{{RESOURCES}}/yaml-spectrum/lead.html}}
      - card_grid_start:
          - type: html
          - value: <div class="spectrum-page"><section class="spectrum-grid">
      - imported_card:
          - inherit: spectrum_card
          - values:
              eyebrow: imports + inheritance
              title: Imported base, local values
              body: This card inherits its template and default values from an imported YAML partial, then overrides the values here.
              chips:
                - imports
                - inherit
                - override
              cta:
                - type: html
                - value: <a class="spectrum-action" href="/yaml-spectrum/status" hx-get="/yaml-spectrum/status" hx-target="#yaml-spectrum-status" hx-swap="outerHTML">Render the fragment</a>
      - inline_card:
          - type: template
          - inline: |
              <article class="spectrum-card">
                <p class="spectrum-eyebrow">{{.eyebrow}}</p>
                <h2>{{.title}}</h2>
                <p>{{.body}}</p>
                {{.example}}
              </article>
          - values:
              eyebrow: inline template
              title: Values can contain bricks
              body: The example below is an HTML component mounted inside template values.
              example:
                - type: html
                - value: <p><code>example</code> is rendered by the HTML component before template execution.</p>
      - nested_order:
          - type: tree
          - layer_one:
              - type: tree
              - layer_two:
                  - type: tree
                  - first_leaf:
                      - type: html
                      - value: <article class="spectrum-card"><p class="spectrum-eyebrow">nested tree</p><h2>Layer three, first leaf</h2><p>Source sequence creates @order for every nested tree.</p></article>
                  - second_leaf:
                      - type: html
                      - value: <article class="spectrum-card"><p class="spectrum-eyebrow">ordered items</p><h2>Layer three, second leaf</h2><p>No numeric keys are needed for deterministic rendering.</p></article>
      - card_grid_end:
          - type: html
          - value: </section>
      - directories:
          - type: template
          - template: "{{TEMPLATE:spectrum/directories.html}}"
          - values:
              module_var: "{{VAR:module}}"
              module_marker: "{{MODULE}}"
              module_root: "{{MODULE_ROOT}}"
              resources: "{{RESOURCES}}"
              templates: "{{TEMPLATES}}"
              static: "{{STATIC}}"
              hyperbricks: "{{HYPERBRICKS}}"
              static_asset: "{{STATIC}}/yaml-spectrum.css"
      - status_target:
          - type: html
          - value: <div id="yaml-spectrum-status" class="spectrum-status"><strong>Fragment target:</strong> click "Render the fragment" to replace this block with /yaml-spectrum/status.</div>
      - page_close:
          - type: html
          - value: </div>

yaml_spectrum_status:
  - type: fragment
  - route: yaml-spectrum/status
  - title: YAML spectrum fragment
  - response:
      hx_trigger: yaml-spectrum-fragment-rendered
      hx_target: "#yaml-spectrum-status"
      hx_reswap: outerHTML
  - panel:
      - inherit: spectrum_status_card
      - values:
          title: Fragment rendered
          message: This fragment was loaded from the same YAML runtime pipeline and inherited its template from the imported partial.
          source: "{{VAR:hyperbricks}}/yaml-spectrum.hyperbricks.yaml"
