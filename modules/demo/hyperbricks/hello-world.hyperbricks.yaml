page:
  - type: hypermedia
  - route: index
  - title: Hello World
  - main:
      - type: tree
      - intro:
          - type: html
          - value: <main><h1>Hello World</h1></main>
      - template_file:
          - type: template
          - template: "{{TEMPLATE:hello-card.html}}"
          - values:
              heading: Template file
              body: This block is loaded from modules/demo/templates/hello-card.html.
              cta:
                - type: html
                - value: <a href="/about">Edit this link</a>
      - inline_template:
          - type: template
          - inline: |
              <section class="hello-inline">
                <h2>{{.heading}}</h2>
                <p>{{.body}}</p>
              </section>
          - values:
              heading: Inline template
              body: This block lives directly in hello-world.hyperbricks.yaml.
      - spectrum_link:
          - type: html
          - value: |
              <p><a href="/yaml-spectrum">Open the YAML runtime spectrum demo</a></p>
