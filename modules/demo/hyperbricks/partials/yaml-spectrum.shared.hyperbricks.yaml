spectrum_card:
  - type: template
  - template:
      file: spectrum/card.html
  - values:
      eyebrow: imported base
      title: Imported card template
      body: This base card lives in hyperbricks/partials/yaml-spectrum.shared.hyperbricks.yaml.
      chips:
        - import
        - inheritance
        - template.file resolver

spectrum_status_card:
  - type: template
  - template:
      file: spectrum/status.html
  - values:
      title: Fragment status
      message: This fragment body is inherited from an imported YAML component.
      source:
        path:
          base: hyperbricks
          path: partials/yaml-spectrum.shared.hyperbricks.yaml
