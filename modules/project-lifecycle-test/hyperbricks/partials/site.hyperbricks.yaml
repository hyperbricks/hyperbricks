imports:
  - assets.hyperbricks.yaml
  - navigation.hyperbricks.yaml

# Pages override title and body.values.content; the shell stays in one place.
lifecycle_page:
  - type: hypermedia
  - title: Project Lifecycle Fixture · HyperBricks
  - doctype: '<!DOCTYPE html>'
  - htmltag: '<html lang="en">'
  - head:
      - type: head
      - metadata:
          - type: html
          - value: |
              <meta charset="utf-8">
              <meta name="viewport" content="width=device-width, initial-scale=1">
      - styles:
          - inherit: lifecycle_styles
      - scripts:
          - inherit: lifecycle_scripts
  - body:
      - type: template
      - template:
          file: shell.html
      - values:
          page_title: Project Lifecycle Fixture
          navigation:
            - inherit: lifecycle_navigation
          content:
            - type: html
            - value: '<p>Choose a page to explore.</p>'
