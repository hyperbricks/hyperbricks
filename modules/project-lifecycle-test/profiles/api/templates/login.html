<section class="panel">
  <h1>Try a demo role</h1>
  <p>Choose a public demo role to see how a guarded route responds. These fixed tokens are for local fixture only: anyone can choose either role.</p>
  <form method="post" action="/actions/demo-login" hx-post="/actions/demo-login" hx-target="#demo-auth-result" hx-swap="innerHTML">
    <button name="role" value="owner" type="submit">Try owner access</button>
    <button name="role" value="viewer" type="submit">Try viewer access</button>
  </form>
  <form method="post" action="/actions/demo-logout" hx-post="/actions/demo-logout" hx-target="#demo-auth-result" hx-swap="innerHTML">
    <button type="submit">Clear the demo session</button>
  </form>
  <div id="demo-auth-result" aria-live="polite"></div>
  <p><a href="/advanced/settings">Open owner settings</a> · <a href="/advanced">API profile</a></p>
  <p>With no session you return here. A viewer goes to the explanation page. An owner can read the settings.</p>
</section>
