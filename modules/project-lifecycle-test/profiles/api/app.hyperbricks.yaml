imports:
  - ../../hyperbricks/app.hyperbricks.yaml

vars:
  advanced_api:
    env:
      name: HYPERBRICKS_LIFECYCLE_API_URL
      default: http://127.0.0.1:8099

advanced_shell:
  - inherit: lifecycle_page
  - nocache: true
  - head:
      - advanced_script:
          - type: esbuild
          - entry:
              path: {base: module, path: profiles/api/feedback.js}
          - outfile:
              path: {base: static, path: js/advanced.js}
          - cache: true
          - fingerprint: true
          - enclose: '<script src="|" defer></script>'
  - body:
      - values:
          navigation:
            - inherit: lifecycle_navigation
            - values:
                active: /advanced

advanced_project_panel:
  - type: api_render
  - endpoint:
      format: '%s/api/project'
      args:
        - var: advanced_api
  - method: GET
  - querykeys: []
  - template:
      file: ../profiles/api/templates/project-panel.html

advanced_page:
  - inherit: advanced_shell
  - route: advanced
  - title: Project Lifecycle Fixture — API profile
  - body:
      - values:
          page_title: API read and write
          content:
            - type: template
            - template:
                file: ../profiles/api/templates/api.html
            - values:
                project:
                  - inherit: advanced_project_panel

advanced_project_fragment:
  - type: fragment
  - route: fragments/advanced-project
  - nocache: true
  - content:
      - inherit: advanced_project_panel

advanced_project_save:
  - type: api_fragment_render
  - route: actions/advanced-project-save
  - endpoint:
      format: '%s/api/project'
      args:
        - var: advanced_api
  - method: POST
  - querykeys: []
  - headers:
      Content-Type: application/json
  - body: '{"name":"$name","version":"$version"}'
  - template:
      file: ../profiles/api/templates/save-result.html

advanced_login_page:
  - inherit: advanced_shell
  - route: advanced/login
  - title: Project Lifecycle Fixture — Demo roles
  - body:
      - values:
          page_title: Try a demo role
          content:
            - type: template
            - template:
                file: ../profiles/api/templates/login.html

advanced_login_action:
  - type: api_fragment_render
  - route: actions/demo-login
  - endpoint:
      format: '%s/auth/demo-login'
      args:
        - var: advanced_api
  - method: POST
  - querykeys: []
  - headers:
      Content-Type: application/json
  - body: '{"role":"$role"}'
  - setcookies:
      - 'token={{.Data.token}}; Path=/; HttpOnly; SameSite=Lax'
  - template:
      file: ../profiles/api/templates/login-result.html

advanced_logout_action:
  - type: api_fragment_render
  - route: actions/demo-logout
  - endpoint:
      format: '%s/auth/demo-logout'
      args:
        - var: advanced_api
  - method: POST
  - querykeys: []
  - setcookies:
      - 'token=; Path=/; HttpOnly; SameSite=Lax; Max-Age=0'
  - template:
      file: ../profiles/api/templates/logout-result.html

advanced_settings_page:
  - inherit: advanced_shell
  - route: advanced/settings
  - title: Project Lifecycle Fixture — Owner settings
  - guard:
      enabled: true
      auth:
        cookie: token
        header: Authorization
        scheme: Bearer
      require:
        authenticated: true
      authorize:
        endpoint:
          format: '%s/auth/owner'
          args:
            - var: advanced_api
        method: GET
      on_unauthenticated:
        default:
          status: 303
          headers:
            Location: /advanced/login
        variants:
          - when:
              request_headers:
                HX-Request: "true"
            response:
              status: 401
              headers:
                HX-Redirect: /advanced/login
      on_forbidden:
        default:
          status: 303
          headers:
            Location: /advanced/forbidden
        variants:
          - when:
              request_headers:
                HX-Request: "true"
            response:
              status: 403
              headers:
                HX-Redirect: /advanced/forbidden
  - body:
      - values:
          page_title: Owner settings
          content:
            - type: api_render
            - endpoint:
                format: '%s/api/settings'
                args:
                  - var: advanced_api
            - method: GET
            - querykeys: []
            - template:
                file: ../profiles/api/templates/settings.html

advanced_forbidden_page:
  - inherit: advanced_shell
  - route: advanced/forbidden
  - title: Project Lifecycle Fixture — Owner role needed
  - body:
      - values:
          page_title: An owner role is needed
          content:
            - type: template
            - template:
                file: ../profiles/api/templates/forbidden.html
