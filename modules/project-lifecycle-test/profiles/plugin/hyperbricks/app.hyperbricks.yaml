imports:
  - ../../../hyperbricks/app.hyperbricks.yaml

project_name_review:
  - type: plugin
  - plugin: LifecycleTestPlugin__project-lifecycle-test@1.0.0
  - data:
      action: preview
      template:
        file: ../profiles/plugin/templates/review-result.html

advanced_workflow_page:
  - inherit: lifecycle_page
  - route: advanced/workflow
  - title: Project Lifecycle Fixture — Plugin profile
  - nocache: true
  - body:
      - values:
          page_title: One plugin, two actions
          navigation:
            - inherit: lifecycle_navigation
            - values:
                active: /advanced/workflow
          content:
            - type: template
            - template:
                file: ../profiles/plugin/templates/workflow.html

advanced_name_preview:
  - type: fragment
  - route: actions/advanced-name-preview
  - nocache: true
  - content:
      - inherit: project_name_review

advanced_name_confirm:
  - type: fragment
  - route: actions/advanced-name-confirm
  - nocache: true
  - content:
      - inherit: project_name_review
      - data:
          action: confirm
