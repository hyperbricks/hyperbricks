# Static profile. It loads one exportable route and no server-only actions.
hyperbricks:
  mode: development
  metadata:
    module: project-lifecycle-test
    moduleversion: "1.0.0"
  development:
    watch: false
    reload: false
    frontend_errors: false
    dashboard: false
  server:
    port: 8106
    beautify: false
    read_timeout: 10s
    write_timeout: 10s
    idle_timeout: 30s
  plugins:
    enabled: []
  directories:
    hyperbricks:
      path: {base: module, path: profiles/static/hyperbricks}
    resources:
      path: {base: module, path: resources}
    templates:
      path: {base: module, path: templates}
    static:
      path: {base: module, path: static}
    render:
      path: {base: module, path: rendered}
    plugins: ./bin/plugins
