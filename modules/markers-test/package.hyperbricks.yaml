myconf:
  some: value

hyperbricks:
  mode: development

  debug:
    level: debugging

  development:
    watch: true
    reload: true
    dashboard: true

  live:
    cache: 30s

  server:
    port: 8080
    beautify: true
    read_timeout: 5s
    write_timeout: 10s
    idle_timeout: 20s
    keep_alives_enabled: true

  system:
    metrics_watch_interval: 10s

  rate_limit:
    requests_per_second: 100
    burst: 500

  plugins:
    enabled: []

  directories:
    render:
      path:
        base: module
        path: rendered
    static:
      path:
        base: module
        path: static
    resources:
      path:
        base: module
        path: resources
    plugins: ./bin/plugins/
    templates:
      path:
        base: module
        path: templates
    hyperbricks:
      path:
        base: module
        path: hyperbricks
