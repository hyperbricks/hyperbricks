hyperbricks:
  mode: development
  metadata:
    module: todo-demo-unpoly
    moduleversion: "1.0.0"
    hyperbricks: v1.2.5-beta
  development:
    watch: true
    watch_dirs: [hyperbricks, templates, resources]
    reload: false
    frontend_errors: false
    dashboard:
      enabled: false
      credentials:
        user:
          env: HB_DEVELOPER_USER
        password:
          env: HB_DEVELOPER_PASSWORD
  server:
    port: 8123
    beautify: false
    read_timeout: 10s
    write_timeout: 10s
    idle_timeout: 30s
  rate_limit:
    enabled: true
    requests_per_second: 100
    burst: 200
  plugins:
    enabled: []
  directories:
    hyperbricks:
      path: {base: module, path: hyperbricks}
    resources:
      path: {base: module, path: resources}
    templates:
      path: {base: module, path: templates}
    static:
      path: {base: module, path: static}
    render:
      path: {base: module, path: rendered}
    plugins: ./bin/plugins
