hyperbricks:
  mode: development
  metadata:
    module: esbuild-demo
    moduleversion: "1.0.0"
    hyperbricks: v1.2.5-beta
  development:
    watch: true
    watch_dirs: [hyperbricks, templates, resources]
    reload: false
    frontend_errors: true
    dashboard:
      enabled: false
  server:
    port: 8097
    beautify: false
    read_timeout: 10s
    write_timeout: 30s
    idle_timeout: 30s
  plugins:
    enabled: []
  directories:
    hyperbricks:
      path: {base: module, path: hyperbricks}
    resources:
      path: {base: module, path: resources}
    templates:
      path: {base: module, path: templates}
    static:
      path: {base: module, path: static}
    render:
      path: {base: module, path: rendered}
