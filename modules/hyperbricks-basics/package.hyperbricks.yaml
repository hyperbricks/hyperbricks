hyperbricks:
  mode: development
  metadata:
    module: hyperbricks-basics
    moduleversion: "1.0.0"
  development:
    watch: true
    watch_dirs: [hyperbricks, templates, resources]
    reload: true
    frontend_errors: false
    dashboard: false
  server:
    port: 8104
    beautify: false
    read_timeout: 10s
    write_timeout: 10s
    idle_timeout: 30s
  plugins:
    enabled: []
  rate_limit:
    enabled: true
    requests_per_second: 100
    burst: 200
  directories:
    hyperbricks:
      path: {base: module, path: hyperbricks}
    resources:
      path: {base: module, path: resources}
    templates:
      path: {base: module, path: templates}
    static:
      path: {base: module, path: static}
    render:
      path: {base: module, path: rendered}
    plugins: ./bin/plugins
