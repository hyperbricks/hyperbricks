imports:
  - partials/site.hyperbricks.yaml
  - partials/views.hyperbricks.yaml

overview_page:
  - inherit: basics_page
  - route: index
  - title: Overview · Project Desk
  - body:
      - values:
          content:
            - inherit: overview_view

overview_fragment:
  - type: fragment
  - route: fragments/overview
  - nocache: true
  - content:
      - inherit: overview_view

status_fragment:
  - type: fragment
  - route: fragments/status
  - nocache: true
  - content:
      - inherit: basics_status

projects_page:
  - inherit: basics_page
  - route: projects
  - title: Projects · Project Desk
  - body:
      - values:
          navigation:
            - inherit: basics_navigation
            - values:
                active: /projects
          content:
            - inherit: projects_view

projects_fragment:
  - type: fragment
  - route: fragments/projects
  - content:
      - inherit: projects_view

atlas_page:
  - inherit: basics_page
  - route: projects/atlas
  - title: Atlas · Project Desk
  - body:
      - values:
          navigation:
            - inherit: basics_navigation
            - values:
                active: /projects
          content:
            - inherit: atlas_view

atlas_fragment:
  - type: fragment
  - route: fragments/projects/atlas
  - content:
      - inherit: atlas_view

beacon_page:
  - inherit: atlas_page
  - route: projects/beacon
  - title: Beacon · Project Desk
  - body:
      - values:
          content:
            - inherit: beacon_view

beacon_fragment:
  - type: fragment
  - route: fragments/projects/beacon
  - content:
      - inherit: beacon_view

estimate_page:
  - inherit: basics_page
  - route: estimate
  - title: Estimate · Project Desk
  - body:
      - values:
          navigation:
            - inherit: basics_navigation
            - values:
                active: /estimate
          content:
            - inherit: estimate_view

estimate_fragment:
  - type: fragment
  - route: fragments/estimate
  - content:
      - inherit: estimate_view

# Standalone public content: its static export needs no running server.
handbook_page:
  - type: hypermedia
  - route: handbook
  - title: Project handbook · HyperBricks
  - doctype: '<!DOCTYPE html>'
  - htmltag: '<html lang="en">'
  - head:
      - type: head
      - metadata:
          - type: html
          - value: |
              <meta charset="utf-8">
              <meta name="viewport" content="width=device-width, initial-scale=1">
      - styles:
          - inherit: basics_styles
  - body:
      - type: template
      - template:
          file: handbook.html
