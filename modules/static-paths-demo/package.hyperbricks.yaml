hyperbricks:
  mode: development
  metadata:
    module: static-paths-demo
    moduleversion: "1.0.0"
    hyperbricks: v1.2.5-beta
  development:
    watch: false
    reload: false
    frontend_errors: false
    dashboard:
      enabled: false
  server:
    port: 8096
    beautify: false
  plugins:
    enabled: []
  directories:
    hyperbricks:
      path: {base: module, path: hyperbricks}
    templates:
      path: {base: module, path: templates}
    resources:
      path: {base: module, path: resources}
    plugins:
      path: {base: module, path: plugins}
    render:
      path: {base: module, path: render-output}
    static:
      path: {base: module, path: static}
