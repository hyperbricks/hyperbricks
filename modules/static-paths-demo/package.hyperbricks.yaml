hyperbricks:
  mode: development

  metadata:
    module: static-paths-demo
    moduleversion: "1.0"
    format: hra
    format_version: "1"
    commit: unknown
    built_at: "1970-01-01T00:00:00Z"
    hyperbricks: v0.0.0
  development:
    watch: false
    reload: false
    frontend_errors: false
    dashboard:
      enabled: false
  server:
    port: 8096
    beautify: false
  plugins:
    enabled: []
  directories:
    hyperbricks:
      path: {base: module, path: hyperbricks}
    templates:
      path: {base: module, path: templates}
    resources:
      path: {base: module, path: resources}
    plugins:
      path: {base: module, path: plugins}
    render:
      path: {base: module, path: render-output}
    static:
      path: {base: module, path: static}
