imports:
  - partials/init-components.hyperbricks.yaml

vars:
  page:
    title: Hello World
    heading: Hello World
    eyebrow: HyperBricks YAML runtime fixture
  links:
    status_fragment: /hello-status

page:
  - type: hypermedia
  - route: index
  - title:
      format: "%s | %s"
      args:
        - var: page.title
        - config: myconf.demo.section
  - head:
      - type: head
      - meta:
          description:
            format: "%s generated by the init module."
            args:
              - config: myconf.demo.title
      - inline_css:
          - type: css
          - inline: |
              .hello-fixture {
                max-width: 64rem;
                margin: 2rem auto;
                font-family: system-ui, sans-serif;
              }
              .hello-grid {
                display: grid;
                grid-template-columns: repeat(auto-fit, minmax(16rem, 1fr));
                gap: 1rem;
              }
              .hello-card,
              .hello-inline,
              .hello-panel {
                border: 1px solid #d8dee8;
                border-radius: .5rem;
                padding: 1rem;
              }
  - main:
      - type: tree
      - enclose: <main class="hello-fixture">|</main>
      - intro:
          - type: html
          - value:
              format: |
                <header>
                  <p>%s</p>
                  <h1>%s</h1>
                </header>
              args:
                - var: page.eyebrow
                - var: page.heading
      - template_file:
          - inherit: init_card
          - values:
              heading: Template file
              body: This block is loaded from modules/demo/templates/hello-card.html.
              cta:
                - type: html
                - value:
                    format: <a href="%s">%s</a>
                    args:
                      - var: links.status_fragment
                      - config: myconf.demo.cta_label
      - inline_template:
          - type: template
          - inline: |
              <section class="hello-inline">
                <h2>{{.heading}}</h2>
                <p>{{.body}}</p>
                <p>{{.resource_copy}}</p>
                <p>{{.environment}}</p>
              </section>
          - values:
              heading: Inline template
              body: This block lives directly in hello-world.hyperbricks.yaml.
              resource_copy:
                file:
                  base: resources
                  path: init-copy.txt
              environment:
                env:
                  name: HYPERBRICKS_INIT_FIXTURE
                  default: Environment resolver fallback is active.
      - nested_tree:
          - type: tree
          - enclose: <section class="hello-grid">|</section>
          - article:
              - type: tree
              - enclose: <article class="hello-panel">|</article>
              - heading:
                  - type: html
                  - value: <h2>Nested TREE</h2>
              - copy:
                  - type: text
                  - value: Three nested levels keep source order through @order.
      - path_probe:
          - type: template
          - inline: |
              <section class="hello-inline">
                <h2>{{.heading}}</h2>
                <p>{{.static_path}}</p>
              </section>
          - values:
              heading: Path resolver
              static_path:
                path:
                  base: static
                  path: css/app.css

status_fragment:
  - type: fragment
  - route: hello-status
  - response:
      headers:
        HX-Trigger: init-fixture-status
        HX-Retarget: "#hello-status"
        HX-Reswap: outerHTML
  - status:
      - type: template
      - template:
          file: hello-status.html
      - values:
          title: Init fixture status
          body:
            format: "%s can render fragments, templates and response metadata."
            args:
              - config: myconf.demo.title
