hyperbricks:
  mode: development
  metadata:
    module: streaming-demo
    moduleversion: "0.1.0"
  development:
    watch: false
    reload: false
    dashboard: false
  server:
    port: 18110
    beautify: false
    read_timeout: 5s
    write_timeout: 15s
    idle_timeout: 30s
  plugins:
    enabled:
      - StreamingDemoPlugin__streaming-demo@1.0.0
  directories:
    hyperbricks:
      path: {base: module, path: hyperbricks}
    templates:
      path: {base: module, path: templates}
    resources:
      path: {base: module, path: resources}
    static:
      path: {base: module, path: static}
    render:
      path: {base: module, path: rendered}
    plugins: ./bin/plugins
