vars:
  api_security_upstream:
    env:
      name: HYPERBRICKS_API_SECURITY_UPSTREAM
      default: http://127.0.0.1:8098

dashboard:
  - type: fragment
  - route: dashboard
  - nocache: true
  - content:
      - type: tree
      - user_private:
          - type: api_render
          - endpoint:
              format: '%s/private/user'
              args:
                - var: api_security_upstream
          - method: GET
          - querykeys: []
          - forwardtoken: user_session
          - template:
              file: api-result.html
      - admin_private:
          - type: api_render
          - endpoint:
              format: '%s/private/admin'
              args:
                - var: api_security_upstream
          - method: GET
          - querykeys: []
          - forwardtoken: admin_session
          - template:
              file: api-result.html
      - public_status:
          - type: api_render
          - endpoint:
              format: '%s/public'
              args:
                - var: api_security_upstream
          - method: GET
          - querykeys: []
          - template:
              file: api-result.html
      - service_status:
          - type: api_render
          - endpoint:
              format: '%s/service'
              args:
                - var: api_security_upstream
          - method: GET
          - querykeys: []
          - headers:
              Authorization: Bearer fixture-service-token
          - template:
              file: api-result.html

login:
  - type: api_fragment_render
  - route: actions/login
  - endpoint:
      format: '%s/issue/valid'
      args:
        - var: api_security_upstream
  - method: POST
  - querykeys: []
  - setcookies:
      - name: user_session
        value: '{{.Data.user_token}}'
        path: /
        http_only: true
        secure: false
        same_site: Lax
      - name: admin_session
        value: '{{.Data.admin_token}}'
        path: /
        http_only: true
        secure: false
        same_site: Strict
  - template:
      file: action-result.html

login_missing_token:
  - type: api_fragment_render
  - route: actions/login-missing-token
  - endpoint:
      format: '%s/issue/missing'
      args:
        - var: api_security_upstream
  - method: POST
  - querykeys: []
  - setcookies:
      - name: user_session
        value: '{{.Data.user_token}}'
        path: /
        http_only: true
        secure: false
        same_site: Lax
      - name: admin_session
        value: '{{.Data.admin_token}}'
        path: /
        http_only: true
        secure: false
        same_site: Strict
  - template:
      file: action-result.html

login_empty_token:
  - type: api_fragment_render
  - route: actions/login-empty-token
  - endpoint:
      format: '%s/issue/empty'
      args:
        - var: api_security_upstream
  - method: POST
  - querykeys: []
  - setcookies:
      - name: user_session
        value: '{{.Data.user_token}}'
        path: /
        http_only: true
        secure: false
        same_site: Lax
      - name: admin_session
        value: '{{.Data.admin_token}}'
        path: /
        http_only: true
        secure: false
        same_site: Strict
  - template:
      file: action-result.html

login_invalid_token:
  - type: api_fragment_render
  - route: actions/login-invalid-token
  - endpoint:
      format: '%s/issue/invalid'
      args:
        - var: api_security_upstream
  - method: POST
  - querykeys: []
  - setcookies:
      - name: user_session
        value: '{{.Data.user_token}}'
        path: /
        http_only: true
        secure: false
        same_site: Lax
      - name: admin_session
        value: '{{.Data.admin_token}}'
        path: /
        http_only: true
        secure: false
        same_site: Strict
  - template:
      file: action-result.html

login_invalid_json:
  - type: api_fragment_render
  - route: actions/login-invalid-json
  - endpoint:
      format: '%s/issue/trailing-json'
      args:
        - var: api_security_upstream
  - method: POST
  - querykeys: []
  - setcookies:
      - name: decode_should_not_commit
        value: otherwise-valid-literal
        path: /
        http_only: true
        secure: false
        same_site: Lax
  - inline: '<p>Decoded response accepted.</p>'

login_template_error:
  - type: api_fragment_render
  - route: actions/login-template-error
  - endpoint:
      format: '%s/issue/valid'
      args:
        - var: api_security_upstream
  - method: POST
  - querykeys: []
  - setcookies:
      - name: template_should_not_commit
        value: '{{.Data.user_token}}'
        path: /
        http_only: true
        secure: false
        same_site: Lax
  - inline: '{{call .Data.user_token}}'

logout:
  - type: api_fragment_render
  - route: actions/logout
  - endpoint:
      format: '%s/logout'
      args:
        - var: api_security_upstream
  - method: POST
  - querykeys: []
  - setcookies:
      - name: user_session
        value: ''
        path: /
        http_only: true
        secure: false
        same_site: Lax
        max_age: 0
      - name: admin_session
        value: ''
        path: /
        http_only: true
        secure: false
        same_site: Strict
        max_age: 0
  - template:
      file: logout-result.html

private_fragment:
  - type: api_fragment_render
  - route: actions/private
  - endpoint:
      format: '%s/private/fragment'
      args:
        - var: api_security_upstream
  - method: GET
  - querykeys: []
  - forwardtoken: user_session
  - template:
      file: api-result.html

public_fragment:
  - type: api_fragment_render
  - route: actions/public
  - endpoint:
      format: '%s/public/fragment'
      args:
        - var: api_security_upstream
  - method: GET
  - querykeys: []
  - forwardtoken: ""
  - template:
      file: api-result.html

