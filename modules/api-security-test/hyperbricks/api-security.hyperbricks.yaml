basic_conflict:
  - type: api_fragment_render
  - route: conflicts/basic
  - endpoint:
      format: '%s/conflicts/basic'
      args:
        - var: api_security_upstream
  - method: GET
  - querykeys: []
  - forwardtoken: user_session
  - username: conflict-user
  - password: conflict-password
  - template:
      file: api-result.html

invalid_forwardtoken_types:
  - type: fragment
  - route: invalid-forwardtoken-types
  - nocache: true
  - content:
      - type: tree
      - before:
          - type: html
          - value: '<p id="invalid-before">before</p>'
      - boolean_value:
          - type: api_render
          - endpoint:
              format: '%s/invalid/bool'
              args:
                - var: api_security_upstream
          - method: GET
          - querykeys: []
          - forwardtoken: false
          - template:
              file: api-result.html
      - numeric_value:
          - type: api_render
          - endpoint:
              format: '%s/invalid/number'
              args:
                - var: api_security_upstream
          - method: GET
          - querykeys: []
          - forwardtoken: 7
          - template:
              file: api-result.html
      - after:
          - type: html
          - value: '<p id="invalid-after">after</p>'

invalid_forwardtoken_fragment:
  - type: api_fragment_render
  - route: invalid-forwardtoken-fragment
  - endpoint:
      format: '%s/invalid/fragment-number'
      args:
        - var: api_security_upstream
  - method: GET
  - querykeys: []
  - forwardtoken: 11
  - template:
      file: api-result.html

