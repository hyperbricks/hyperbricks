          format: '%s/debug/nested/path-secret?api_key=configured-query-secret'
          args:
            - var: api_security_upstream
      - method: GET
      - querykeys: []
      - forwardtoken: user_session
      - headers:
          X-Api-Key: renderer-api-key-secret
