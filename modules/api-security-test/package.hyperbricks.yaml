hyperbricks:
  mode: development

  metadata:
    module: api-security-test
    moduleversion: "1.0.0"
    format: hra
    format_version: "1"
    commit: unknown
    built_at: "1970-01-01T00:00:00Z"
    hyperbricks: v0.0.0

  development:
    watch: true
    reload: true
    frontend_errors: false
    dashboard: false

  server:
    port: 8105
    beautify: false

  rate_limit:
    enabled: false

  plugins:
    enabled: []

  directories:
    hyperbricks:
      path: {base: module, path: hyperbricks}
    templates:
      path: {base: module, path: templates}
    resources:
      path: {base: module, path: resources}
    static:
      path: {base: module, path: static}
    render:
      path: {base: module, path: rendered}
    plugins: ./bin/plugins
