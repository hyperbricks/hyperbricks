imports:
  - "partials/site.hyperbricks.yaml"

rail_items:
  - "0_builder":
      target: right_column
      fragment: rail-builder
      label: Builder
  - "1_assets":
      target: right_column
      fragment: rail-assets
      label: Assets
      sub_section:
        - "#rail-assets-uploads"
        - "#rail-assets-files"
      sub_labels:
        - Uploads
        - Files
  - "2_status":
      target: right_column
      fragment: rail-status
      label: Status
      sub_section:
        - "#rail-status-summary"
        - "#rail-status-settings"
        - "#rail-status-history"
      sub_labels:
        - Summary
        - Settings
        - History

section_rail_shell:
  - inherit: "pattern_site_page"
  - content:
      - type: template
      - template:
          file: patterns/section-rail-shell.html

rail_builder_panel:
  - type: fragment
  - route: fragments/rail-builder
  - nocache: "true"
  - content:
      - type: template
      - template:
          file: patterns/section-rail-builder.html

rail_assets_panel:
  - type: fragment
  - route: fragments/rail-assets
  - nocache: "true"
  - content:
      - type: template
      - template:
          file: patterns/section-rail-assets.html

rail_status_panel:
  - type: fragment
  - route: fragments/rail-status
  - nocache: "true"
  - content:
      - type: template
      - template:
          file: patterns/section-rail-status.html

app_section_rail_demo:
  - inherit: "section_rail_shell"
  - route: section-rail-demo
  - title: Section Rail Demo
  - content:
      - values:
          page_title: Config-Driven Section Rail
          page_intro: "A data map drives the whole rail. The template derives the HTMX fragment route, the swap target, and the subsection anchor links from the same config object."
          current_route: /section-rail-demo
          items:
            - inherit: "rail_items"
          content:
            - type: tree
            - content:
                - type: template
                - template:
                    file: patterns/section-rail-landing.html

app_rail_builder:
  - inherit: "section_rail_shell"
  - route: rail-builder
  - title: Builder
  - content:
      - values:
          page_title: Config-Driven Section Rail
          page_intro: "The Builder entry shows the simple variant: one config row, one fragment route, one target region."
          current_route: /rail-builder
          items:
            - inherit: "rail_items"
          content:
            - inherit: "rail_builder_panel.content"

app_rail_assets:
  - inherit: "section_rail_shell"
  - route: rail-assets
  - title: Assets
  - content:
      - values:
          page_title: Config-Driven Section Rail
          page_intro: The Assets entry shows how one rail item can carry subsection anchors that point into the swapped fragment content.
          current_route: /rail-assets
          items:
            - inherit: "rail_items"
          content:
            - inherit: "rail_assets_panel.content"

app_rail_status:
  - inherit: "section_rail_shell"
  - route: rail-status
  - title: Status
  - content:
      - values:
          page_title: Config-Driven Section Rail
          page_intro: "The Status entry uses the same config shape but with a denser subsection list, which makes the rail act as a mini outline for the target panel."
          current_route: /rail-status
          items:
            - inherit: "rail_items"
          content:
            - inherit: "rail_status_panel.content"
