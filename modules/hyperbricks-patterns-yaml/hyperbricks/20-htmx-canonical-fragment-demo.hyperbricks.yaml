imports:
  - "partials/site.hyperbricks.yaml"

status_demo_shell:
  - inherit: "pattern_site_page"
  - content:
      - type: template
      - template:
          file: patterns/layout-shell.html
      - values:
          section_title: HyperBricks Patterns
          section_intro: "Small, concrete examples of reusable HyperBricks patterns."
          content_right:
            - type: tree

status_demo_summary:
  - type: fragment
  - route: fragments/status-demo-summary
  - nocache: "true"
  - content:
      - type: template
      - template:
          file: patterns/status-summary.html

status_demo_settings:
  - type: fragment
  - route: fragments/status-demo-settings
  - nocache: "true"
  - content:
      - type: template
      - template:
          file: patterns/status-settings.html

status_demo_overview_panel:
  - type: tree
  - content:
      - type: template
      - template:
          file: patterns/status-overview.html

status_demo_plugin_panel:
  - type: plugin
  - plugin: "TemplateConfigDemoPlugin__hyperbricks-patterns-yaml@2.0.0"
  - data:
      template:
        file: demo.html
      class: pattern-plugin-panel
      content: "\"## Plugin panel\\n\\nThis panel is rendered by the **Template Config Plugin** and injected through the same canonical HTMX flow.\""

status_demo_plugin:
  - type: fragment
  - route: fragments/status-demo-plugin
  - nocache: "true"
  - status_demo_plugin_panel_10:
      - inherit: "status_demo_plugin_panel"

status_demo_base_view:
  - type: tree
  - content:
      - type: template
      - template:
          file: patterns/status-demo.html
      - values:
          page_url: /status-demo
          fragment_url: /fragments/status-demo
          summary_fragment_url: /fragments/status-demo-summary
          settings_fragment_url: /fragments/status-demo-settings
          plugin_fragment_url: /fragments/status-demo-plugin
          landing_page_url: /status-demo
          summary_page_url: /status-demo/summary
          settings_page_url: /status-demo/settings
          plugin_page_url: /status-demo/plugin
          active_panel: overview
          panel:
            - inherit: "status_demo_overview_panel.content"

status_demo:
  - type: fragment
  - route: fragments/status-demo
  - nocache: "true"
  - "10_10":
      - inherit: "status_demo_base_view.content"

status_demo_summary_view:
  - inherit: "status_demo_base_view"
  - content:
      - values:
          page_url: /status-demo/summary
          active_panel: summary
          panel:
            - inherit: "status_demo_summary.content"

status_demo_settings_view:
  - inherit: "status_demo_base_view"
  - content:
      - values:
          page_url: /status-demo/settings
          active_panel: settings
          panel:
            - inherit: "status_demo_settings.content"

status_demo_plugin_view:
  - inherit: "status_demo_base_view"
  - content:
      - values:
          page_url: /status-demo/plugin
          active_panel: plugin
          panel:
            - inherit: "status_demo_plugin_panel"

app_status_demo_summary:
  - inherit: "status_demo_shell"
  - route: status-demo/summary
  - content:
      - values:
          content_right:
            - inherit: "status_demo_summary_view.content"

app_status_demo:
  - inherit: "status_demo_shell"
  - route: status-demo
  - content:
      - values:
          content_right:
            - inherit: "status_demo_base_view.content"

app_status_demo_settings:
  - inherit: "status_demo_shell"
  - route: status-demo/settings
  - content:
      - values:
          content_right:
            - inherit: "status_demo_settings_view.content"

app_status_demo_plugin:
  - inherit: "status_demo_shell"
  - route: status-demo/plugin
  - content:
      - values:
          content_right:
            - inherit: "status_demo_plugin_view.content"
