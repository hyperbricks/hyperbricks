esbuild:
  - type: plugin
  - plugin: "EsbuildPlugin@2.0.0"
  - data:
      entry: js/main.js
      outfile: js/bundle.min.main.js
      minify: "true"
      minifyident: "true"
      mangle: "false"
      sourcemap: "true"
      debug: "false"
      cache: "false"
      enclose: "<script src=\"/|\" defer></script>"
