tailwind:
  - type: plugin
  - plugin: "TailwindcssPlugin@2.0.0"
  - data:
      input_css:
        path:
          base: module
          parts:
            - resources
            - css
            - base.css
      output_css:
        path:
          base: module
          parts:
            - static
            - css
            - styles.css
      signal: "false"
      minify: "true"
      debug: "true"
      cache: "true"
      binary: tailwindcss
      enclose: "<link rel=\"stylesheet\" href=\"/|\">"
