imports:
  - "partials/site.hyperbricks.yaml"

api_fragment_write_demo_shell:
  - inherit: "pattern_site_page"
  - nocache: "true"
  - content:
      - type: template
      - template:
          file: patterns/api-fragment-write-demo.html

api_fragment_write_refresh_probe:
  - type: fragment
  - route: fragments/api-fragment-write-refresh-probe
  - nocache: "true"
  - content:
      - type: template
      - template:
          file: patterns/api-fragment-write-refresh-probe.html

api_fragment_write_mock_success:
  - type: fragment
  - route: fragments/mock-postgrest-file-save-success
  - nocache: "true"
  - content:
      - type: template
      - template:
          file: patterns/mock-postgrest-file-save-success.json

api_fragment_write_mock_conflict:
  - type: fragment
  - route: fragments/mock-postgrest-file-save-conflict
  - nocache: "true"
  - content:
      - type: template
      - template:
          file: patterns/mock-postgrest-file-save-conflict.json

api_fragment_write_save_success:
  - type: api_fragment_render
  - route: patterns/assets/file-save-success
  - nocache: "true"
  - method: POST
  - endpoint:
      format: "%s/fragments/mock-postgrest-file-save-success"
      args:
        - config: myconf.patterns.mock_api_base
  - headers:
      Content-Type: application/json
      Accept: application/json
  - querykeys: []
  - body: "{\"p_project_slug\":\"$project\",\"p_file_id\":$file_id,\"p_kind\":\"$kind\",\"p_path\":\"$path\",\"p_content\":\"$content\"}"
  - template:
      file: patterns/api-file-write-result.html
  - response:
      headers:
        HX-Trigger: hb-pattern-assets-refresh

api_fragment_write_save_conflict:
  - type: api_fragment_render
  - route: patterns/assets/file-save-conflict
  - nocache: "true"
  - method: POST
  - endpoint:
      format: "%s/fragments/mock-postgrest-file-save-conflict"
      args:
        - config: myconf.patterns.mock_api_base
  - headers:
      Content-Type: application/json
      Accept: application/json
  - querykeys: []
  - body: "{\"p_project_slug\":\"$project\",\"p_file_id\":$file_id,\"p_kind\":\"$kind\",\"p_path\":\"$path\",\"p_content\":\"$content\"}"
  - template:
      file: patterns/api-file-write-result.html
  - response:
      headers:
        HX-Trigger: hb-pattern-assets-refresh

app_api_fragment_write_demo:
  - inherit: "api_fragment_write_demo_shell"
  - route: api-fragment-write-demo
