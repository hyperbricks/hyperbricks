myconf:
  some: value
  demo:
    title: HyperBricks
    section: Starter
    cta_label: Load status fragment
hyperbricks:
  mode: development
  metadata:
    module: "neon-pong"
    moduleversion: "1.0.0"
    hyperbricks: v1.2.9-beta
  debug:
    level: debugging
  development:
    watch: true
    reload: false
    watch_dirs: [hyperbricks, templates, resources]
    frontend_errors: false
    dashboard:
      enabled: false
      credentials:
        user: {env: HB_DEVELOPER_USER}
        password: {env: HB_DEVELOPER_PASSWORD}
    frontend_editing:
      enabled: false
  live:
    cache: 30s
  server:
    port: 8080
    # Auto follows Go CPU/container defaults; fixed integers must be 1..logical CPUs.
    gomaxprocs: auto
    beautify: true
    self_closing_tags: true
    routing:
      clean_urls: true
      index_files:
        - index.html
        - index.htm
      extensions:
        - html
        - htm
    read_timeout: 5s
    write_timeout: 10s
    idle_timeout: 20s
    keep_alives_enabled: true
  system:
    metrics_watch_interval: 10s
  rate_limit:
    enabled: true
    requests_per_second: 100
    burst: 500
  plugins:
    enabled: []
  directories:
    render:
      path:
        base: module
        path: rendered
    static:
      path:
        base: module
        path: static
    resources:
      path:
        base: module
        path: resources
    plugins: ./bin/plugins/
    templates:
      path:
        base: module
        path: templates
    hyperbricks:
      path:
        base: module
        path: hyperbricks
