scaffold_styles:
  - type: esbuild
  - entry:
      path: {base: resources, path: css/app.css}
  - outfile:
      path: {base: static, path: css/app.css}
  - minify: false
  - cache: true
  - fingerprint: false
  - enclose: '<link rel="stylesheet" href="|">'

scaffold_scripts:
  - type: esbuild
  - entry:
      path: {base: resources, path: js/app.ts}
  - outfile:
      path: {base: static, path: js/app.js}
  - minify: false
  - cache: true
  - fingerprint: false
  - enclose: '<script src="|" defer></script>'
