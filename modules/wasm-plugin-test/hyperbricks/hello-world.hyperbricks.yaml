page:
  - type: hypermedia
  - route: index
  - title: WASM Plugin Test
  - main:
      - type: tree
      - enclose: <main class="wasm-plugin-test">|</main>
      - markdown:
          - type: plugin
          - plugin: MarkdownWasmPlugin@1.0.0
          - data:
              content: "# Hello from MarkdownWasmPlugin"
              class: wasm-markdown
      - card:
          - type: plugin
          - plugin: MyPluginWasmPlugin@1.0.0
          - data:
              title: Hello from MyPlugin WASM
              message: This card was rendered by the myplugin_wasm example.
              eyebrow: Plugin tutorial
              cta_label: Read the plugin docs
              cta_href: /docs/plugins
              accent: "#2563eb"
              class: myplugin-wasm-demo
