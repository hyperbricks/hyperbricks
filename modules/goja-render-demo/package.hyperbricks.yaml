hyperbricks:
  mode: development

  metadata:
    module: goja-render-demo
    moduleversion: "1.0"
    format: hra
    format_version: "1"
    commit: unknown
    built_at: "1970-01-01T00:00:00Z"
    hyperbricks: v0.0.0
  development:
    watch: true
    reload: false
    frontend_errors: false
    dashboard: false
  live:
    cache: 30s
  server:
    port: 8095
    beautify: false
    read_timeout: 10s
    write_timeout: 10s
    idle_timeout: 30s
  plugins:
    enabled: []
  directories:
    hyperbricks:
      path:
        base: module
        path: hyperbricks
    resources:
      path:
        base: module
        path: resources
    templates:
      path:
        base: module
        path: templates
    static:
      path:
        base: module
        path: static
    render:
      path:
        base: module
        path: rendered
