name: Render and API race contracts

on:
  push:
    branches: [develop, 'release/**']
  pull_request:

permissions:
  contents: read

jobs:
  render-api:
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v4
        with:
          go-version: 1.26.1
      - name: Build the pinned external esbuild engine
        run: go build -o "${RUNNER_TEMP}/hb-esbuild" github.com/evanw/esbuild/cmd/esbuild
      - name: Renderers, compiled plans, and API transport
        env:
          ESBUILD_TEST_BINARY: ${{ runner.temp }}/hb-esbuild
        run: go test -race ./pkg/render ./pkg/renderplan ./pkg/component ./pkg/composite ./pkg/shared/apiutil -count=1 -timeout=180s
      - name: Status arbitration, request isolation, and asset lifecycle
        env:
          ESBUILD_TEST_BINARY: ${{ runner.temp }}/hb-esbuild
        run: go test -race ./pkg/shared ./cmd/hyperbricks -run 'TestResponseStatus|TestAPIResponseCookieCapture|TestAPISecurityModule|TestAPIMultichannel|TestServeContent.*(API|ResponseStatus)|Esbuild|TestImage|TestMarkdown|TestRuntimeAssetCleanup|TestRuntimeReload|TestRuntimeWatcher|TestStatusIndicator' -count=1 -timeout=180s
      - name: Catalog image URL refresh contracts
        run: go test -race ./modules/catalog-store/tests -count=1 -timeout=60s
  catalog-client:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Catalog multichannel client contracts
        run: node --test modules/catalog-store/tests/*.test.mjs
      - name: Development indicator request isolation
        run: node --test assets/status-indicator.test.mjs
