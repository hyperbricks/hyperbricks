name: CI Hyperbricks Tests
permissions:
  contents: read
on:
  push:
    branches:
      - develop
  pull_request:
    branches:
      - develop

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: 1.23.4

      - name: Run all tests
        run: bash ./scripts/run_all_tests.sh
        env:
          BRANCH_NAME: ${{ github.ref_name }}
